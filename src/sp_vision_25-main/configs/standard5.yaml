# distort_coeffs: [-0.124627, 0.167497, -0.008347, 0.012856, 0.0]
camera_matrix: [3516.569497162674, 0, 890.65836002474202, 0, 3529.1271697250349, 154.39892003989257, 0, 0, 1]
distort_coeffs: [0.0021865986827320056, -0.5213719059228703, -0.01778988405843562, 0.015523018493275765, 0]

R_camera2gimbal: [0.000000, 0.000000, 1.000000, -1.000000, -0.022689, 0.000000, 0.022689, -0.999744, 0.000000]

t_camera2gimbal: [0.145, 0, 0.07]



#####-----cboard参数-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

#####-----gimbal参数-----#####
com_port: "/dev/gimbal"
yaw_kp: 0
yaw_kd: 0
pitch_kp: 0
pitch_kd: 0

#####-----planner-----#####
fire_thresh: 0.0035

max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]

#####-----buff_detector参数-----#####
model: "assets/yolo11_buff_int8.xml"

#####-----buff_aimer参数-----#####
fire_gap_time: 0.700   # s
predict_time: 0.120     # s
