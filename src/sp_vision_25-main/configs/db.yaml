#####-----cboard参数-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

#####-----gimbal参数-----#####
com_port: "/dev/gimbal"

#####-----planner-----#####
fire_thresh: 0.02
convergence_thresh: 0.1
mid_ratio: 0.9

# 显式方案参数
transition_ratio: 0.3  # 过渡段时间调整 (0.0=最小过渡满足动力学约束, 1.0=最大过渡无跟随段)

# 动力学约束
max_yaw_acc: 50 #20~100
max_pitch_acc: 100 #无法调整，电控端加梯度 

